name: arduino-nano-matter
plugs:
  arduino-nano-matter-probe:  # debug probe: Arm DAPLink / CMSIS-DAP
    interface: custom-device
    subsystem: usb
    vendorid: "0d28"
  arduino-nano-matter-console:  # console: Arm DAPLink / CMSIS-DAP virtual COM port
    interface: custom-device
